[package]
name = "script-audit-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only function knowledge and validated test-script composition over MCP"

[dependencies]
script-checker = { path = "vendor/script-checker-0.1.0", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
regex = "1"
sha2 = "0.11"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time"], optional = true }
rusqlite = { version = "0.40.2", default-features = false, optional = true }
postgres = { version = "0.19", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
url = { version = "2", optional = true }

[features]
default = ["database", "mcp"]
database = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls", "dep:url"]
legacy-sqlite = ["dep:rusqlite"]
mcp = ["dep:rmcp", "dep:tokio"]

[[bin]]
name = "script-audit-mcp"
path = "src/main.rs"
required-features = ["database", "mcp"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
