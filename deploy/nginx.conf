# Install as /etc/nginx/sites-available/script-audit-mcp.
# This file must be included inside nginx's http context.
map $http_host $script_audit_bad_host {
    default 1;
    "10.176.2.139:39064" 0;
}

map $http_origin $script_audit_bad_origin {
    default 1;
    "" 0;
    "http://10.176.2.139:39064" 0;
}

server {
    listen 10.176.2.139:39064;
    server_name 10.176.2.139;
    server_tokens off;

    if ($script_audit_bad_host) { return 403; }
    if ($script_audit_bad_origin) { return 403; }

    # allow 127.0.0.1;
    # allow 10.176.2.139;
    # Add approved client IPs or LAN/VPN CIDRs here before deny all.
    # Do not infer an allowed subnet from the server's address.
    # deny all;

    access_log /var/log/nginx/script-audit-mcp.access.log;
    error_log /var/log/nginx/script-audit-mcp.error.log;

    client_max_body_size 4m;
    client_body_timeout 60s;

    location = /mcp {
        proxy_pass http://127.0.0.1:39065;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    location / {
        return 404;
    }
}
